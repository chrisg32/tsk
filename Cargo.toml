[package]
name = "tsk"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Plain-text tasks (PlainTasks/TaskPaper format) in your terminal — standalone or as a herdr plugin"
license = "MIT"
repository = "https://github.com/chrisg32/tsk"
readme = "README.md"
keywords = ["todo", "tasks", "tui", "taskpaper", "herdr"]
categories = ["command-line-utilities"]

[[bin]]
name = "tsk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
